name: Workflow validation

on:
  pull_request:
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The organization requires SHA-pinned actions. actions.lock pins every
  # action, including ones that other actions call, so a stale lockfile fails
  # jobs at setup.
  actions-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the workflow action lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        # Install the gh-actions-lock release that Renovate uses, from
        # constraints.ghActionsLock in renovate.json.
        run: |
          version="$(sed -nE 's/^[[:space:]]*"ghActionsLock":[[:space:]]*"([^"]*)".*/\1/p' renovate.json)"
          test -n "$version"
          gh extension install github/gh-actions-lock --pin "$version"
          gh actions-lock --verify
